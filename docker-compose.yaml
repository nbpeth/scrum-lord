services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secrets
      POSTGRES_DB: scrumlord
    volumes:
      - data:/var/lib/postgresql
      - ./api/db-ddl.sql:/docker-entrypoint-initdb.d/01-db-ddl.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d scrumlord"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20
    working_dir: /app/api
    command: sh -c "yarn install && node server.js"
    environment:
      PORT: 8080
      API_KEY: key123
      DATABASE_URL: postgresql://user:secrets@postgres:5432/scrumlord
    volumes:
      - .:/app
      - api_node_modules:/app/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: node:20
    working_dir: /app
    command: sh -c "yarn install && yarn vite --host 0.0.0.0 --port 8080"
    environment:
      VITE_API_KEY: key123
      VITE_PROXY_TARGET: http://api:8080
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  data:
  api_node_modules:
  ui_node_modules:
